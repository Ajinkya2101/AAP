<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AAP{% endblock %} · AAP</title>
  <script src="/static/htmx.min.js"></script>
  <style>
    :root { --fg:#1d1d1f; --muted:#6b6b70; --line:#e3e3e6; --bg:#fff; --panel:#f6f6f8; --accent:#2856c9;
            --ok:#1f7a3a; --warn:#9a6300; --bad:#b3261e; --bar:#8d8d96; }
    @media (prefers-color-scheme: dark) { :root { --fg:#ececf0; --muted:#9a9aa3; --line:#34343a; --bg:#17171a;
            --panel:#202024; --accent:#7ea2ff; --ok:#6fcf8a; --warn:#e8b34a; --bad:#ff8a80; --bar:#74747e; } }
    * { box-sizing: border-box; }
    body { font: 14px/1.45 system-ui, sans-serif; color: var(--fg); background: var(--bg); margin: 0; }
    header { display: flex; gap: 18px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line);
             flex-wrap: wrap; }
    header b { margin-right: 8px; }
    header a { text-decoration: none; }
    header a.on { font-weight: 600; text-decoration: underline; }
    header form { margin-left: auto; color: var(--muted); }
    main { padding: 0 16px 32px; }
    h1 { font-size: 18px; margin: 16px 0 6px; }
    h2 { font-size: 15px; margin: 20px 0 6px; }
    p.muted, .muted { color: var(--muted); }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; white-space: nowrap; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    a { color: var(--accent); }
    code { font-size: 12px; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 12px; }
    .chip { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; text-decoration: none; }
    .chip.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    .pass { color: var(--ok); } .warning { color: var(--warn); } .fail, .error { color: var(--bad); }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
    .grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 16px; }
    @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }
    iframe { width: 100%; height: 80vh; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
    input[type=text], input[type=search], textarea { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px;
                                 background: var(--bg); color: var(--fg); width: 100%; }
    input.small { width: 7em; } input.acct { width: 13em; }
    button { font: inherit; padding: 4px 12px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel);
             color: var(--fg); cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
    button.danger { color: var(--bad); }
    .flash { padding: 8px 12px; border-radius: 6px; margin: 12px 0; border: 1px solid var(--line); }
    .flash.error { border-color: var(--bad); }
    pre { white-space: pre-wrap; margin: 0; font: inherit; }
    form.upload { display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
    form.upload label { font-weight: 600; }
    input[type=file] { font: inherit; color: var(--fg); max-width: 100%; }
    input[type=file]::file-selector-button { font: inherit; padding: 4px 12px; margin-right: 8px; border-radius: 5px;
                                             border: 1px solid var(--line); background: var(--panel); color: var(--fg);
                                             cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .busy { display: none; } .busy.htmx-request { display: inline; }
    form.upload { padding: 8px 12px; border: 1px dashed var(--line); border-radius: 8px; }
    form.upload.drop { border-color: var(--accent); background: var(--panel); }
    #upload-queue { margin: 4px 0 12px; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 8px 0; }
    .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
    .tile b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
    a.tile { text-decoration: none; color: inherit; }
    a.tile b { color: var(--accent); }
    h3 { font-size: 14px; font-weight: 600; margin: 12px 0 4px; }
    form.search, .bulk, .pager { display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
    form.search label { font-weight: 600; }
    form.search input[type=search] { width: 24em; max-width: 100%; }
    th.check, td.check { width: 1%; }
    input[type=checkbox] { accent-color: var(--accent); margin: 2px 0 0; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 0 24px; }
    .bars { display: grid; grid-template-columns: max-content minmax(40px, 1fr) max-content; gap: 4px 8px;
            align-items: center; }
    .bars a { text-decoration: none; }
    .bars i { display: block; height: 10px; min-width: 2px; background: var(--bar); border-radius: 0 4px 4px 0; }
    .bars b { font-weight: 400; text-align: right; font-variant-numeric: tabular-nums; }
    .cols { display: flex; align-items: flex-end; gap: 2px; height: 90px; border-bottom: 1px solid var(--line); }
    .cols span { flex: 1; height: 100%; display: flex; align-items: flex-end; }
    .cols i { display: block; width: 100%; background: var(--bar); border-radius: 4px 4px 0 0; }
    .cols span:hover i { background: var(--fg); }
    .axis { display: flex; justify-content: space-between; }
    form.inline { display: inline; }
  </style>
</head>
<body>
  <header>
    <b>ACSE AP</b>
    <a href="/ui" class="{{ 'on' if nav == 'dashboard' }}">Dashboard</a>
    <a href="/ui/admin" class="{{ 'on' if nav == 'admin' }}">Admin</a>
    <a href="/docs">API</a>
    <form method="post" action="/ui/whoami">Acting as
      <input type="text" name="user" value="{{ user }}" style="width:9em" onchange="this.form.submit()"></form>
  </header>
  <main>
    {% if flash %}<div class="flash {{ flash_kind }}">{{ flash }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
