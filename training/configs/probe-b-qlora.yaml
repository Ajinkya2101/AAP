# Memory and speed of adapter B at the real sequence lengths (median about 2.8k, max 4.2k tokens) without
# client data: smoke-b's made-up examples padded with made-up filler (chat-data/probe-b, git-ignored;
# build it with: train.bat shell, then python -m aap_train.probe).
# Same settings as b-qlora.yaml; a few steps. Its scores mean nothing.
name: probe-b-qlora
task: decide
model: {base: Qwen/Qwen2.5-VL-7B-Instruct, size_b: 8.3}
method: {name: qlora, rank: 16, alpha: 32}
data: {dataset: chat-data/probe-b, max_seq_len: 5120}
train: {max_steps: 12, batch_size: 1, grad_accum: 8, learning_rate: 2.0e-4, save_steps: 6, logging_steps: 1}
eval: {limit: 4, max_new_tokens: 256}
