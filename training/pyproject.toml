[project]
name = "aap-train"
version = "0.1.0"
description = "Training pipeline for the AAP extraction (adapter A) and Oracle-fields (adapter B) models"
requires-python = ">=3.12,<3.13"
dependencies = [
    # CUDA 12.8 builds (RTX 5090, Blackwell sm_120) from the PyTorch index below
    "torch>=2.7",
    "torchvision>=0.22",
    "transformers>=4.53",
    "peft>=0.15",
    "accelerate>=1.6",
    "bitsandbytes>=0.45.3",
    "safetensors>=0.5",
    "pillow>=11.0",
    "pyyaml>=6.0",
    "pydantic>=2.9",
]

[project.optional-dependencies]
wandb = ["wandb>=0.19"]

[project.scripts]
aap-train = "aap_train.train:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aap_train"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["gpu: needs a CUDA GPU and downloads a model"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
